<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIKova | Businesses & Management</title>
<meta name="description" content="FIKova business registration, product catalogue and management">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#bd1f35;--deep:#7c1626;--ink:#13213b;--muted:#64748b;--line:#e3e8ef;--bg:#f5f7fb;--white:#fff;--ok:#077e5e;--amber:#a66503}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}
a{color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}.app-header{background:#fff;border-bottom:1px solid var(--line);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1380px)/2));gap:12px}
.brand{font-size:24px;font-weight:900;letter-spacing:-1px;color:var(--red)}.brand small{font-size:10px;color:var(--muted);font-weight:800;display:block;letter-spacing:1px;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top-actions a{font-size:12px;font-weight:700;text-decoration:none}.ghost,.primary,.quiet,.danger{border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:800}
.primary{background:var(--red);color:#fff;border-color:var(--red)}.danger{background:#fff2f3;color:var(--deep);border-color:#f4cad0}.quiet{background:#f1f5f9}.primary:hover{background:var(--deep)}.ghost:hover,.quiet:hover{background:#edf2f7}
.shell{max-width:1380px;margin:0 auto;padding:24px 20px 56px}.auth-card{max-width:920px;margin:36px auto;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 22px 60px #0c214010;display:grid;grid-template-columns:0.8fr 1.2fr}
.auth-art{padding:40px;background:linear-gradient(160deg,#891e30,#d33448);color:#fff;min-height:480px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art h1{font-size:36px;line-height:1.12;margin:20px 0}.auth-art p{font-size:13px;line-height:1.8;color:#ffe7ec}.auth-content{padding:34px}.auth-content h2{margin:0 0 8px;font-size:23px}.muted{color:var(--muted);font-size:12px;line-height:1.65}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#f3f5f9;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:800;color:var(--muted)}.tab.active{background:#fff0f2;border-color:#efb7c1;color:var(--red)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12px;font-weight:750}.field input,.field textarea,.field select{border:1px solid #d7dee8;border-radius:10px;padding:11px 12px;background:#fff;min-height:41px;color:var(--ink);outline-color:var(--red)}.field textarea{min-height:85px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.span2{grid-column:1/-1}
.notice{padding:13px 15px;border-radius:11px;background:#fff3e0;color:#7e4d00;font-size:12px;line-height:1.55;margin:13px 0;border:1px solid #fde0a3}.notice.good{background:#e7f7ef;color:#086543;border-color:#b5e6d0}.notice.error{background:#fff0f0;color:#9c2630;border-color:#f7bfc3}
.layout{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}.sidebar{position:sticky;top:16px;background:#fff;border-radius:17px;border:1px solid var(--line);padding:18px;min-height:420px}
.side-head{padding:10px 12px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}.side-head b{font-size:16px}.side-head span{font-size:11px;color:var(--muted);display:block;margin-top:6px}
.nav-btn{display:block;width:100%;text-align:left;border:0;background:transparent;color:#526277;padding:13px;border-radius:10px;font-size:12px;font-weight:800;margin:3px 0}
.nav-btn.active,.nav-btn:hover{background:#fcecef;color:var(--red)}.workspace{min-width:0}.workspace-title{font-size:27px;font-weight:900;letter-spacing:-.8px;margin:2px 0 6px}
.subtitle{font-size:12px;color:var(--muted);margin:0 0 22px;line-height:1.65}.card{padding:21px;border-radius:17px;background:#fff;border:1px solid var(--line);margin:0 0 15px;box-shadow:0 6px 24px #061e3208}.card h3{font-size:16px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.stat{background:#fff;padding:18px;border:1px solid var(--line);border-radius:14px}.stat small{color:var(--muted);font-size:11px;font-weight:700}.stat strong{display:block;font-size:28px;margin-top:7px}
.badge{display:inline-block;padding:6px 9px;border-radius:20px;background:#edf1f7;color:#536479;font-size:10px;font-weight:800}.badge.active{background:#dcf7ea;color:#076941}.badge.pending{background:#fff4d8;color:#905500}.badge.suspended{background:#ffe5e9;color:#ac253b}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.split{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.list-card{padding:17px;border:1px solid var(--line);border-radius:13px;background:#fff;margin:12px 0}.company-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.company-title{font-size:17px;font-weight:850;margin:0 0 5px}
.company-code{font-size:11px;color:var(--muted);font-weight:700}.company-meta{font-size:12px;color:#516175;line-height:1.8}
.billing{background:#f8fafc;padding:13px;border-radius:11px;margin-top:15px;border:1px solid #e7edf5}
.product-photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px;background:#e8edf5}
.product-title{font-size:14px;margin:10px 0 4px;font-weight:850}.product-price{font-size:16px;font-weight:850;margin:7px 0}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}.switch{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800}.switch input{width:19px;height:19px;accent-color:var(--ok)}
.empty{padding:22px;text-align:center;color:#66758b;border:1px dashed #d4dce7;border-radius:12px;font-size:12px}
hr{border:0;border-top:1px solid var(--line);margin:17px 0}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px;min-width:580px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px}
#toast{position:fixed;right:16px;bottom:16px;max-width:380px;z-index:100;background:#172339;color:#fff;box-shadow:0 12px 30px #07132736;border-radius:11px;padding:13px 16px;font-size:12px;line-height:1.5}
@media(max-width:880px){.auth-card{grid-template-columns:1fr}.auth-art{min-height:auto;padding:22px}.auth-art h1{font-size:23px}.layout{grid-template-columns:1fr}.sidebar{position:static;min-height:0}.nav-set{display:flex;overflow:auto;gap:6px}.nav-btn{width:auto;white-space:nowrap}.shell{padding:18px 12px}}
@media(max-width:550px){.fields{grid-template-columns:1fr}.span2{grid-column:auto}.auth-content{padding:22px}.app-header{height:auto;padding:12px}.brand{font-size:20px}.workspace-title{font-size:23px}.card{padding:15px}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0"></script>
<script defer src="fikova-config.js"></script>
<script defer src="fikova-business.js"></script>
</head>
<body>
<header class="app-header"><div class="brand">FIKova <small>Businesses · Assurance Regent-inspired management</small></div><div class="top-actions"><a href="index.html">← FIKova Home</a><button id="marketTop" class="ghost" type="button">Marketplace</button><button id="signoutTop" class="danger hidden" type="button">Sign out</button></div></header>
<main id="root" class="shell"><div class="card">Loading FIKova Business services…</div></main>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
</body>
</html>
